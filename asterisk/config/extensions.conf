; Dialplan of the T100 emulator. Static file: runtime values are read with
; ${ENV(VAR)}. entrypoint.sh generates extensions_feriados.conf (holidays).

[general]
static=yes
writeprotect=no
clearglobalvars=no

#include extensions_feriados.conf

; ---------------------------------------------------------------------------
; Softphone (the human). 1/2/3 = manual recorded call to a provider.
; ---------------------------------------------------------------------------
[from-softphone]
exten => 1,1,Gosub(sub-dial-provider,s,1(openai,manual))
 same => n,Hangup()

exten => 2,1,Gosub(sub-dial-provider,s,1(elevenlabs,manual))
 same => n,Hangup()

exten => 3,1,Gosub(sub-dial-provider,s,1(livekit,manual))
 same => n,Hangup()

; "Call the clinic main number": goes through the time rule like the T100.
exten => 100,1,Goto(central,s,1)

exten => *98,1,Answer()
 same => n,VoiceMailMain(9000@lab)
 same => n,Hangup()

; Audio sanity check (echo of what the softphone says).
exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; ---------------------------------------------------------------------------
; Emulates the T100 Time Condition. TIME_MODE = auto | night | day.
; auto: night on holidays or outside OFFICE_HOURS (America/Argentina/Cordoba).
; ---------------------------------------------------------------------------
[central]
exten => s,1,NoOp(Time condition: TIME_MODE=${ENV(TIME_MODE)} OFFICE_HOURS=${ENV(OFFICE_HOURS)})
 same => n,Gosub(sub-check-holiday,s,1)
 same => n,GotoIf($["${ENV(TIME_MODE)}"="night"]?night)
 same => n,GotoIf($["${ENV(TIME_MODE)}"="day"]?day)
 same => n,GotoIf($["${HOLIDAY}"="1"]?night)
 same => n,GotoIfTime(${ENV(OFFICE_HOURS)},*,*,*,America/Argentina/Cordoba?day)
 same => n(night),Verbose(1,Central: NIGHT rule -> provider ${ENV(NIGHT_PROVIDER)} (holiday=${HOLIDAY}))
 same => n,Gosub(sub-dial-provider,s,1(${ENV(NIGHT_PROVIDER)},central))
 same => n,Hangup()
; Day branch is a STAND-IN for "administration would answer this call".
; Built-in sounds are English, so switch the channel language first.
 same => n(day),Verbose(1,Central: DAY rule -> stand-in for administration (holiday=${HOLIDAY}))
 same => n,Answer()
 same => n,Set(CHANNEL(language)=en)
 same => n,Playback(beep)
 same => n,Playback(vm-goodbye)
 same => n,Hangup()

; ---------------------------------------------------------------------------
; Shared subroutine: place a recorded call to a provider.
; ARG1 = provider (openai|elevenlabs|livekit), ARG2 = flow name.
; On anything other than ANSWER, emulate the T100 fallback: voicemail.
; ---------------------------------------------------------------------------
[sub-dial-provider]
exten => s,1,Set(PROVIDER=${ARG1})
 same => n,Set(FLOW=${ARG2})
 same => n,GotoIf($["${PROVIDER}"="openai"]?t_openai)
 same => n,GotoIf($["${PROVIDER}"="elevenlabs"]?t_eleven)
 same => n,GotoIf($["${PROVIDER}"="livekit"]?t_livekit)
 same => n,Verbose(1,sub-dial-provider: unknown provider '${PROVIDER}')
 same => n,Return()
 same => n(t_openai),Set(TARGET=${ENV(OPENAI_PROJECT_ID)})
 same => n,Goto(go)
 same => n(t_eleven),Set(TARGET=${ENV(ELEVENLABS_NUMBER)})
 same => n,Goto(go)
 same => n(t_livekit),Set(TARGET=${ENV(LIVEKIT_NUMBER)})
 same => n(go),GotoIf($["${TARGET}"=""]?notconfigured)
 same => n,Set(CALLERID(num)=${ENV(LAB_CALLER_ID)})
 same => n,Set(BASE=${PROVIDER}-${FLOW}-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${UNIQUEID})
 same => n,Verbose(1,Dialing ${PROVIDER} target=${TARGET} flow=${FLOW} base=${BASE})
 same => n,Dial(PJSIP/${TARGET}@${PROVIDER},${ENV(PROVIDER_ANSWER_TIMEOUT)},b(sub-predial^s^1(${BASE}^${FLOW})))
 same => n,Verbose(1,Provider ${PROVIDER} DIALSTATUS=${DIALSTATUS} base=${BASE})
 same => n,Set(CDR(userfield)=${PROVIDER}|${FLOW}|${DIALSTATUS}|${BASE})
 same => n,GotoIf($["${DIALSTATUS}"="ANSWER"]?done)
; Unanswered call: MixMonitor left header-only WAVs (44 bytes); remove them.
 same => n,System(rm -f /var/spool/asterisk/monitor/${BASE}-mix.wav /var/spool/asterisk/monitor/${BASE}-agent.wav /var/spool/asterisk/monitor/${BASE}-caller.wav)
 same => n,Verbose(1,T100 fallback: provider did not answer -> voicemail 9000@lab)
 same => n,VoiceMail(9000@lab,u)
 same => n(done),Return()
 same => n(notconfigured),Verbose(1,Provider ${PROVIDER} is not configured in .env)
 same => n,Return()

; Runs on the OUTGOING PJSIP channel before the call is sent (Dial option b()).
; ARG1 = base file name, ARG2 = flow name.
; On the outgoing channel: r = audio received from the provider (agent),
; t = audio transmitted to the provider (caller). VERIFY this mapping on the
; first run (agent.wav must contain the agent voice, caller.wav the caller).
[sub-predial]
exten => s,1,Set(PJSIP_HEADER(add,X-Lab-Flow)=${ARG2})
 same => n,MixMonitor(${ARG1}-mix.wav,r(${ARG1}-agent.wav)t(${ARG1}-caller.wav))
 same => n,Return()

; ---------------------------------------------------------------------------
; Where provider REFER transfers land (endpoint context = from-provider).
; Emulates the clinic's urgencias line: ring the softphone when it is idle
; (scripted calls). In a manual call the softphone is the caller itself, so
; it only hears the beep that confirms the transfer landed here.
; ---------------------------------------------------------------------------
[from-provider]
exten => urgencias,1,Verbose(1,REFER received to ${EXTEN})
 same => n,Set(CDR(userfield)=REFER|${EXTEN})
 same => n,Answer()
 same => n,GotoIf($["${DEVICE_STATE(PJSIP/${ENV(SOFTPHONE_USER)})}"!="NOT_INUSE"]?beep)
 same => n,Dial(PJSIP/${ENV(SOFTPHONE_USER)},20)
 same => n(beep),Set(CHANNEL(language)=en)
 same => n,Playback(beep)
 same => n,Hangup()

exten => _+X.,1,Goto(urgencias,1)
exten => _X.,1,Goto(urgencias,1)

; ---------------------------------------------------------------------------
; Entry used by lab.sh: channel originate Local/<provider>-<flow>@lab-run/n
; The Local ;2 side runs this and dials the provider; once answered, the ;1
; side runs the scripted caller in [lab-script].
; ---------------------------------------------------------------------------
[lab-run]
exten => _[a-z].,1,Set(LPROV=${CUT(EXTEN,-,1)})
 same => n,Set(LFLOW=${CUT(EXTEN,-,2)})
 same => n,Gosub(sub-dial-provider,s,1(${LPROV},${LFLOW}))
 same => n,Hangup()

; ---------------------------------------------------------------------------
; Scripted caller. Extension = flow name. Plays lab/<flow>/NN in order.
; NN.barge marker: start talking BARGE_DELAY seconds after the agent starts.
; ---------------------------------------------------------------------------
[lab-script]
exten => _[a-z].,1,NoOp(Scripted caller: flow ${EXTEN})
 same => n,Set(FLOW=${EXTEN})
 same => n,Set(SNDDIR=/usr/share/asterisk/sounds/lab/${FLOW})
 same => n,Set(N=1)
 same => n(loop),Set(NN=${IF($[${N}<10]?0${N}:${N})})
 same => n,GotoIf($[${N}>20]?final)
 same => n,GotoIf($[${STAT(e,${SNDDIR}/${NN}.sln16)}=1]?step)
 same => n,Goto(final)
 ; Wait for the agent (greeting for N=1, otherwise its reply to the previous turn).
 same => n(step),GotoIf($[${STAT(e,${SNDDIR}/${NN}.barge)}=1]?barge)
 same => n,WaitForNoise(200,1,${ENV(AGENT_TURN_TIMEOUT)})
 same => n,WaitForSilence(1200,1,${ENV(AGENT_TURN_TIMEOUT)})
 same => n,Goto(speak)
 same => n(barge),WaitForNoise(200,1,${ENV(AGENT_TURN_TIMEOUT)})
 same => n,Wait(${ENV(BARGE_DELAY)})
 same => n(speak),Verbose(1,Scripted caller ${FLOW}: utterance ${NN})
 same => n,Playback(lab/${FLOW}/${NN})
 same => n,Set(N=$[${N}+1])
 same => n,Goto(loop)
 ; No more utterances: let the agent answer the last one, then hang up.
 same => n(final),WaitForNoise(200,1,${ENV(AGENT_TURN_TIMEOUT)})
 same => n,WaitForSilence(1200,1,${ENV(AGENT_TURN_TIMEOUT)})
 same => n,Hangup()
