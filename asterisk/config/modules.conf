[modules]
autoload=yes
; PJSIP only. Disable legacy / unused channel drivers.
noload => chan_sip.so
noload => chan_iax2.so
noload => chan_skinny.so
noload => chan_mgcp.so
noload => chan_unistim.so
noload => chan_dahdi.so
noload => res_phoneprov.so
noload = app_voicemail_imap.so
noload = app_voicemail_odbc.so
noload = chan_alsa.so
noload = res_hep.so
noload = res_hep_pjsip.so
noload = res_hep_rtcp.so
; Unused realtime/geolocation drivers that only log errors at startup.
noload = res_config_pgsql.so
noload = res_config_ldap.so
noload = res_pjsip_geolocation.so
noload = res_geolocation.so
noload = chan_console.so
noload = chan_oss.so
; Needs res_phoneprov, which is disabled above.
noload = res_pjsip_phoneprov_provider.so
; CDR/CEL backends and DUNDi we do not use (they decline to load and log errors).
noload = cdr_pgsql.so
noload = cdr_radius.so
noload = cdr_tds.so
noload = cdr_sqlite3_custom.so
noload = cel_pgsql.so
noload = cel_radius.so
noload = cel_tds.so
noload = cel_sqlite3_custom.so
noload = pbx_dundi.so
; libunbound rejects some /etc/hosts entries of the host (e.g. Hestia's
; "ubuntu-hestia.localhost 127.0.1.1") and then every lookup fails. Without
; this module PJSIP uses the system resolver.
noload = res_resolver_unbound.so
