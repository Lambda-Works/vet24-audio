services:
  asterisk:
    build: ./asterisk
    image: vet24-sip-lab-asterisk
    # Host networking avoids NAT issues with SIP and the RTP range on a VPS.
    init: true
    network_mode: host
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./recordings:/var/spool/asterisk/monitor
      - ./prompts:/lab/prompts
      - ./certs:/lab/certs
      - ./config/feriados.txt:/lab/feriados.txt:ro
      - voicemail:/var/spool/asterisk/voicemail
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core show version'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  voicemail:
